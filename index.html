<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1B4D3E">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>মাধাইয়া মুক্তিযোদ্ধা স্মৃতি কলেজ, চান্দিনা - শিক্ষক কর্মচারীর তথ্য</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1B4D3E;
    --green-mid:#256B50;
    --gold:#C9A227;
    --gold-light:#E8D48A;
    --off-white:#FAF6EC;
    --paper:#FFFDF6;
    --ink:#26301F;
    --ink-soft:#5b6350;
    --maroon:#7A2E2E;
    --shadow: 0 2px 10px rgba(27,77,62,0.12);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Hind Siliguri', sans-serif;
    background:var(--off-white);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:70px;
  }
  header.letterhead{
    background:linear-gradient(180deg, var(--green-deep), var(--green-mid));
    color:var(--paper);
    padding:18px 16px 22px;
    position:relative;
    border-bottom:4px solid var(--gold);
    box-shadow:var(--shadow);
  }
  header.letterhead::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(232,212,138,0.55);
    border-radius:6px;
    pointer-events:none;
  }
  .lh-inner{
    display:flex;
    align-items:center;
    gap:12px;
    position:relative;
    z-index:1;
  }
  .lh-emblem{
    width:52px;height:52px;flex:0 0 52px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 70%);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    border:2px solid var(--paper);
    box-shadow:0 0 0 2px var(--gold);
  }
  .lh-text h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:.2px;
    font-family:'Tiro Bangla', 'Hind Siliguri', serif;
  }
  .lh-text p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--gold-light);
    font-weight:500;
  }
  .lh-sub{
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:1;
  }
  .lh-sub .badge{
    font-size:13px;
    background:rgba(255,255,255,0.12);
    padding:4px 10px;
    border-radius:20px;
    border:1px solid rgba(232,212,138,0.4);
  }
  #lockBtn{
    background:var(--gold);
    color:var(--green-deep);
    border:none;
    padding:6px 14px;
    border-radius:20px;
    font-weight:600;
    font-size:13px;
    font-family:inherit;
    display:flex;align-items:center;gap:6px;
    cursor:pointer;
  }
  #lockBtn.unlocked{background:var(--maroon);color:var(--paper);}

  .toolbar{
    padding:12px 14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .search-box{
    flex:1;
    min-width:160px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:9px 12px;
    border-radius:8px;
    border:1.5px solid var(--gold-light);
    background:var(--paper);
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
  }
  .btn{
    font-family:inherit;
    border:none;
    padding:9px 14px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-green{background:var(--green-deep);color:var(--paper);}
  .btn-gold{background:var(--gold);color:var(--green-deep);}
  .btn-outline{background:transparent;color:var(--green-deep);border:1.5px solid var(--green-deep);}
  .btn-maroon{background:var(--maroon);color:var(--paper);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .stats{
    display:flex;
    gap:8px;
    padding:0 14px 10px;
    overflow-x:auto;
  }
  .stat-chip{
    background:var(--paper);
    border:1px solid var(--gold-light);
    border-left:4px solid var(--green-deep);
    border-radius:8px;
    padding:8px 12px;
    min-width:110px;
    flex:0 0 auto;
  }
  .stat-chip b{display:block;font-size:17px;color:var(--green-deep);}
  .stat-chip span{font-size:11.5px;color:var(--ink-soft);}
  .stat-chip.warn{border-left-color:var(--maroon);}
  .stat-chip.warn b{color:var(--maroon);}

  #listArea{padding:6px 14px 14px;display:flex;flex-direction:column;gap:10px;}
  .teacher-card{
    background:var(--paper);
    border:1px solid rgba(27,77,62,0.15);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:12px;
    display:flex;
    gap:12px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .teacher-card::before{
    content:attr(data-serial);
    position:absolute;
    top:0;left:0;
    background:var(--green-deep);
    color:var(--gold-light);
    font-size:11px;
    padding:2px 8px 3px 6px;
    border-bottom-right-radius:8px;
    font-weight:600;
  }
  .tc-photo{
    width:58px;height:58px;border-radius:8px;
    object-fit:cover;
    border:2px solid var(--gold-light);
    flex:0 0 58px;
    margin-top:8px;
    background:#eee;
  }
  .tc-photo.placeholder{
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--green-mid);background:#eef3ef;
  }
  .tc-info{flex:1;min-width:0;margin-top:6px;}
  .tc-info h3{margin:0 0 2px;font-size:15.5px;color:var(--green-deep);font-weight:700;}
  .tc-info .tc-subject{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .tc-meta{display:flex;flex-wrap:wrap;gap:6px;}
  .tc-meta span{
    font-size:11px;
    background:#eef3ef;
    color:var(--green-mid);
    padding:2px 7px;
    border-radius:10px;
  }
  .tc-meta span.retire-soon{background:#f7e6e6;color:var(--maroon);font-weight:600;}
  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty-state .em-icon{font-size:40px;margin-bottom:10px;}

  .fab-wrap{
    position:fixed;
    bottom:14px;right:14px;
    display:flex;flex-direction:column;gap:10px;
    z-index:40;
  }
  .fab{
    width:52px;height:52px;border-radius:50%;
    background:var(--green-deep);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;border:none;box-shadow:0 4px 14px rgba(27,77,62,0.35);
    cursor:pointer;
  }
  .fab.gold{background:var(--gold);color:var(--green-deep);font-size:20px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,30,20,0.55);
    display:none;align-items:flex-end;justify-content:center;
    z-index:100;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--off-white);
    width:100%;max-width:520px;
    max-height:92vh;overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:18px 16px 24px;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h2{
    margin:0 0 14px;font-size:17px;color:var(--green-deep);
    border-bottom:2px solid var(--gold-light);padding-bottom:8px;
    font-family:'Tiro Bangla','Hind Siliguri',serif;
  }
  .modal-close{
    position:absolute;top:10px;right:14px;background:none;border:none;
    font-size:20px;color:var(--ink-soft);cursor:pointer;
  }
  .field-group{margin-bottom:12px;}
  .field-group label{
    display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;
  }
  .field-group input,.field-group textarea,.field-group select{
    width:100%;padding:9px 10px;border-radius:7px;
    border:1.4px solid #d8d2bd;background:var(--paper);
    font-family:inherit;font-size:14px;color:var(--ink);
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field-group{flex:1;}
  .photo-upload{
    display:flex;align-items:center;gap:12px;margin-bottom:14px;
  }
  .photo-preview{
    width:70px;height:70px;border-radius:8px;object-fit:cover;
    border:2px dashed var(--gold);background:#eef3ef;
    display:flex;align-items:center;justify-content:center;color:var(--green-mid);font-size:24px;
  }
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;}

  .detail-header{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
  .detail-photo{width:80px;height:80px;border-radius:10px;object-fit:cover;border:2px solid var(--gold);}
  .detail-header h2{margin:0;font-size:18px;color:var(--green-deep);border:none;padding:0;}
  .detail-header p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
  .detail-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    background:var(--paper);border-radius:8px;padding:12px;
    border:1px solid var(--gold-light);
  }
  .detail-grid .dg-item{font-size:13px;}
  .detail-grid .dg-item b{display:block;font-size:11px;color:var(--ink-soft);font-weight:600;}
  .detail-grid .dg-full{grid-column:1/-1;}
  .retire-banner{
    margin-top:12px;padding:10px 12px;border-radius:8px;
    background:#eef3ef;border-left:4px solid var(--green-deep);
    font-size:13.5px;
  }
  .retire-banner.soon{background:#f7e6e6;border-left-color:var(--maroon);color:var(--maroon);font-weight:600;}

  #printArea{display:none;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block !important;
      position:absolute;top:0;left:0;width:100%;
      padding:10mm;
      font-family:'Hind Siliguri', sans-serif;
    }
    .print-letterhead{
      text-align:center;border-bottom:2px solid #1B4D3E;padding-bottom:8px;margin-bottom:14px;
    }
    .print-letterhead h1{margin:0;font-size:20px;color:#1B4D3E;}
    .print-letterhead p{margin:2px 0 0;font-size:12px;color:#555;}
    table.print-table{width:100%;border-collapse:collapse;font-size:11px;}
    table.print-table th, table.print-table td{
      border:1px solid #999;padding:4px 6px;text-align:left;
    }
    table.print-table th{background:#e8e3cf;}
    .print-card{border:1.5px solid #1B4D3E;border-radius:6px;padding:14px;}
    .print-card .pc-head{display:flex;gap:14px;align-items:center;border-bottom:1px solid #C9A227;padding-bottom:10px;margin-bottom:10px;}
    .print-card .pc-head img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1.5px solid #C9A227;}
    .print-card .pc-head h2{margin:0;font-size:18px;color:#1B4D3E;}
    .print-card .pc-head p{margin:2px 0 0;font-size:12px;color:#555;}
    .print-card .pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;}
    .print-card .pc-grid b{display:block;font-size:10.5px;color:#666;}
    .print-footer{margin-top:22px;display:flex;justify-content:space-between;font-size:11px;color:#555;}
  }

  .pw-modal .modal{max-width:360px;}
  .pw-error{color:var(--maroon);font-size:12.5px;margin-top:4px;display:none;}

  .app-footer{
    margin:18px 14px 8px;
    padding:14px 16px;
    background:var(--paper);
    border:1px solid var(--gold-light);
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .app-footer .af-icon{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg, var(--green-deep), var(--green-mid));
    color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:700;flex:0 0 42px;
    border:2px solid var(--gold);
  }
  .app-footer .af-text{font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .app-footer .af-text b{display:block;font-size:13.5px;color:var(--green-deep);font-weight:700;}

  @media print{
    .print-footer-credit{
      margin-top:6px;text-align:center;font-size:10px;color:#777;
      border-top:1px dashed #ccc;padding-top:6px;
    }
  }
</style>
</head>
<body>

<header class="letterhead">
  <div class="lh-inner">
    <div class="lh-emblem">🎓</div>
    <div class="lh-text">
      <h1>মাধাইয়া মুক্তিযোদ্ধা স্মৃতি কলেজ</h1>
      <p>চান্দিনা, কুমিল্লা</p>
      <p style="opacity:.85;margin-top:1px;">শিক্ষক ও কর্মচারীর তথ্য</p>
    </div>
  </div>
  <div class="lh-sub">
    <span class="badge" id="totalBadge">০ জন শিক্ষক</span>
    <button id="lockBtn" onclick="toggleEditMode()">🔒 এডিট মোড</button>
  </div>
</header>

<div class="stats" id="statsStrip"></div>

<div class="toolbar">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="নাম বা বিষয় দিয়ে খুঁজুন..." oninput="renderList()">
  </div>
  <button class="btn btn-outline" onclick="printAllList()">🖨️ তালিকা প্রিন্ট</button>
  <button class="btn btn-gold" id="exportBtn" style="display:none;" onclick="exportBackup()">⬇️ ব্যাকআপ</button>
  <button class="btn btn-outline" id="importBtn" style="display:none;" onclick="triggerImport()">⬆️ রিস্টোর</button>
  <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="handleImportFile(event)">
</div>

<div id="listArea"></div>

<script>
const COLLEGE_NAME = "মাধাইয়া মুক্তিযোদ্ধা স্মৃতি কলেজ";
const COLLEGE_SUB = "চান্দিনা, কুমিল্লা";
let EDIT_PASSWORD = "Rimon@College26";
const RETIREMENT_AGE = 60;

let db;
let editMode = false;
let currentDetailId = null;
let pendingPhotoData = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("staffDB", 1);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if(!database.objectStoreNames.contains("teachers")){
        database.createObjectStore("teachers", { keyPath: "id", autoIncrement: true });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

function getAllTeachers(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction("teachers", "readonly");
    const store = tx.objectStore("teachers");
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = (e) => reject(e);
  });
}

function saveTeacherToDB(teacher){
  return new Promise((resolve, reject) => {
    const tx = db.transaction("teachers", "readwrite");
    const store = tx.objectStore("teachers");
    const req = teacher.id ? store.put(teacher) : store.add(teacher);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function deleteTeacherFromDB(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction("teachers", "readwrite");
    const store = tx.objectStore("teachers");
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = (e) => reject(e);
  });
}

function toBnDigits(num){
  const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  return String(num).replace(/[0-9]/g, d => bn[d]);
}
function bnDate(dateStr){
  if(!dateStr) return "-";
  const d = new Date(dateStr);
  const months = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  return `${toBnDigits(d.getDate())} ${months[d.getMonth()]}, ${toBnDigits(d.getFullYear())}`;
}

function calcExperience(joiningStr){
  if(!joiningStr) return "-";
  const join = new Date(joiningStr);
  const now = new Date();
  let years = now.getFullYear() - join.getFullYear();
  let months = now.getMonth() - join.getMonth();
  let days = now.getDate() - join.getDate();
  if(days < 0){ months--; }
  if(months < 0){ years--; months += 12; }
  if(years < 0) return "যোগদান হয়নি এখনো";
  return `${toBnDigits(years)} বছর ${toBnDigits(months)} মাস`;
}

function calcRetirement(dobStr){
  if(!dobStr) return null;
  const dob = new Date(dobStr);
  const retireDate = new Date(dob);
  retireDate.setFullYear(dob.getFullYear() + RETIREMENT_AGE);
  const now = new Date();
  const diffMs = retireDate - now;
  if(diffMs <= 0){
    return { date: retireDate, remaining: "অবসরপ্রাপ্ত", isPast: true, years:0, months:0 };
  }
  let years = retireDate.getFullYear() - now.getFullYear();
  let months = retireDate.getMonth() - now.getMonth();
  let days = retireDate.getDate() - now.getDate();
  if(days < 0){ months--; }
  if(months < 0){ years--; months += 12; }
  return { date: retireDate, remaining: `${toBnDigits(years)} বছর ${toBnDigits(months)} মাস`, isPast:false, years, months };
}

async function renderList(){
  const all = await getAllTeachers();
  all.sort((a,b) => (a.serial||0) - (b.serial||0));
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = q ? all.filter(t =>
      (t.name||"").toLowerCase().includes(q) ||
      (t.subject||"").toLowerCase().includes(q) ||
      (t.indexNumber||"").toLowerCase().includes(q)
    ) : all;

  document.getElementById("totalBadge").textContent = `${toBnDigits(all.length)} জন শিক্ষক`;

  const soon = all.filter(t => {
    const r = calcRetirement(t.dob);
    return r && !r.isPast && r.years < 1;
  }).length;
  const retired = all.filter(t => {
    const r = calcRetirement(t.dob);
    return r && r.isPast;
  }).length;
  document.getElementById("statsStrip").innerHTML = `
    <div class="stat-chip"><b>${toBnDigits(all.length)}</b><span>মোট শিক্ষক</span></div>
    <div class="stat-chip warn"><b>${toBnDigits(soon)}</b><span>১ বছরের মধ্যে অবসর</span></div>
    <div class="stat-chip"><b>${toBnDigits(retired)}</b><span>অবসরপ্রাপ্ত</span></div>
  `;

  const listArea = document.getElementById("listArea");
  if(filtered.length === 0){
    listArea.innerHTML = `<div class="empty-state"><div class="em-icon">📋</div>${all.length===0 ? "এখনো কোনো শিক্ষকের তথ্য যোগ করা হয়নি।" : "কোনো ফলাফল পাওয়া যায়নি।"}</div>`;
    return;
  }

  listArea.innerHTML = filtered.map(t => {
    const retire = calcRetirement(t.dob);
    const retireSoon = retire && !retire.isPast && retire.years < 1;
    const photoHtml = t.photo
      ? `<img class="tc-photo" src="${t.photo}">`
      : `<div class="tc-photo placeholder">👤</div>`;
    return `
      <div class="teacher-card" data-serial="${toBnDigits(t.serial || '-')}" onclick="openDetail(${t.id})">
        ${photoHtml}
        <div class="tc-info">
          <h3>${t.name || 'নাম নেই'}</h3>
          <div class="tc-subject">${t.subject || ''}${t.indexNumber ? ' • ইনডেক্সঃ '+t.indexNumber : ''}</div>
          <div class="tc-meta">
            <span>অভিজ্ঞতাঃ ${calcExperience(t.joining)}</span>
            ${retire ? `<span class="${retireSoon || retire.isPast ? 'retire-soon' : ''}">${retire.isPast ? 'অবসরপ্রাপ্ত' : 'অবসরে বাকিঃ '+retire.remaining}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function handlePhotoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement("canvas");
      const maxDim = 300;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      pendingPhotoData = canvas.toDataURL("image/jpeg", 0.8);
      document.getElementById("photoPreview").innerHTML = `<img src="${pendingPhotoData}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveTeacher(e){
  e.preventDefault();
  const id = document.getElementById("f_id").value;
  const all = await getAllTeachers();

  const teacher = {
    indexNumber: document.getElementById("f_indexNumber").value.trim(),
    subject: document.getElementById("f_subject").value.trim(),
    name: document.getElementById("f_name").value.trim(),
    address: document.getElementById("f_address").value.trim(),
    academic: document.getElementById("f_academic").value.trim(),
    dob: document.getElementById("f_dob").value,
    joining: document.getElementById("f_joining").value,
    mpo: document.getElementById("f_mpo").value,
    grade: document.getElementById("f_grade").value.trim(),
    scale: document.getElementById("f_scale").value.trim(),
    mobile: document.getElementById("f_mobile").value.trim(),
    email: document.getElementById("f_email").value.trim(),
    nid: document.getElementById("f_nid").value.trim(),
    photo: pendingPhotoData
  };

  if(id){
    teacher.id = Number(id);
    const existing = all.find(x => x.id === teacher.id);
    teacher.serial = existing ? existing.serial : (all.length + 1);
  } else {
    const maxSerial = all.reduce((m,t) => Math.max(m, t.serial||0), 0);
    teacher.serial = maxSerial + 1;
  }

  await saveTeacherToDB(teacher);
  closeModal("formModalOverlay");
  renderList();
}

/* ================= BACKUP (EXPORT / IMPORT) ================= */
async function exportBackup(){
  const all = await getAllTeachers();
  const payload = {
    app: "MMSC Staff Database",
    exportedAt: new Date().toISOString(),
    count: all.length,
    teachers: all
  };
  const dataStr = JSON.stringify(payload, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `staff-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function triggerImport(){
  document.getElementById("importFileInput").value = "";
  document.getElementById("importFileInput").click();
}

async function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  let data;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    data = Array.isArray(parsed) ? parsed : parsed.teachers;
  } catch(err){
    alert("ফাইলটি সঠিক ফরম্যাটে নেই। সঠিক ব্যাকআপ (.json) ফাইল বেছে নিন।");
    return;
  }
  if(!Array.isArray(data)){
    alert("ভুল ব্যাকআপ ফাইল। এই ফাইলে কোনো শিক্ষকের তথ্য পাওয়া যায়নি।");
    return;
  }
  const confirmMsg = `এই ব্যাকআপ ফাইলে ${data.length} জন শিক্ষকের তথ্য আছে।\nবর্তমানে অ্যাপে থাকা সব তথ্য মুছে এই ব্যাকআপ দিয়ে প্রতিস্থাপন করা হবে।\nআপনি কি নিশ্চিত?`;
  if(!confirm(confirmMsg)) return;

  await new Promise((resolve, reject) => {
    const tx = db.transaction("teachers", "readwrite");
    tx.objectStore("teachers").clear();
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });

  await new Promise((resolve, reject) => {
    const tx = db.transaction("teachers", "readwrite");
    const store = tx.objectStore("teachers");
    data.forEach(t => {
      const record = { ...t };
      if(record.id != null){ store.put(record); } else { store.add(record); }
    });
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });

  alert("ব্যাকআপ থেকে সব তথ্য সফলভাবে পুনরুদ্ধার হয়েছে।");
  renderList();
}
